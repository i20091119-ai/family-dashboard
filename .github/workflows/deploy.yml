# 저장해서 올리면 검사 → 만들기 → Cloudflare 에 올리기까지 자동으로 합니다.
# main 작업본 = 진짜 화면(family-dashboard), 그 밖의 작업본 = 미리보기(family-dashboard-preview, 기록 저장소도 따로).
# 열쇠는 포켓퀴즈와 같은 CLOUDFLARE_API_TOKEN (GitHub 저장소 Settings → Secrets and variables → Actions).
name: 올리기

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'main' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 설치
        run: npm ci
      - name: 검사 (typecheck, test)
        run: |
          npm run typecheck
          npm test
      - name: 만들기
        run: npm run build

      - name: 열쇠(토큰) 확인
        id: token
        run: |
          # 칸에 토큰 말고 다른 글(예: Cloudflare 가 보여 주는 curl 시험 명령, "Bearer ")이 섞여 있어도 토큰만 골라 씀
          raw="$CLOUDFLARE_API_TOKEN"
          lines=$(printf '%s\n' "$raw" | grep -c . || true)
          case "$raw" in *curl*) echo "::warning::열쇠 칸에 curl 시험 명령이 들어 있어요. 토큰만 골라 씁니다.";; esac
          case "$raw" in *Bearer*) tok=$(printf '%s' "$raw" | grep -o 'Bearer[[:space:]]*[A-Za-z0-9_-]*' | head -1 | sed 's/^Bearer[[:space:]]*//');; *) tok="";; esac
          [ -n "$tok" ] || tok=$(printf '%s' "$raw" | grep -oE '[A-Za-z0-9_-]{30,}' | tail -1)
          [ -n "$tok" ] || tok=$(printf '%s' "$raw" | tr -d '[:space:]')
          echo "::add-mask::$tok"
          echo "CLOUDFLARE_API_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "열쇠 칸: ${lines}줄, 고른 토큰 길이 ${#tok}자"
          # 토큰을 만든 Cloudflare 계정 번호가 curl 시험 명령에 들어 있으면 그 계정에 올림
          acct=$(printf '%s' "$raw" | grep -oE 'accounts/[0-9a-f]{32}' | head -1 | sed 's#accounts/##')
          cfg=$(grep -oE '"account_id": *"[0-9a-f]{32}"' wrangler.jsonc | grep -oE '[0-9a-f]{32}')
          # 이 토큰으로 들어갈 수 있는 계정 확인 (번호만, 이름·메일은 안 보임)
          curl -s -H "Authorization: Bearer $tok" https://api.cloudflare.com/client/v4/user/tokens/verify > uv.json || true
          curl -s -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > accts.json || true
          node -e '
            const cfg=process.argv[1]; let v={},a={};
            try{v=require("./uv.json")}catch(e){} try{a=require("./accts.json")}catch(e){}
            console.log("토큰 상태:", v.result&&v.result.status, JSON.stringify(v.errors||[]));
            const ids=(a.result||[]).map(x=>x.id);
            console.log("토큰으로 보이는 계정 수:", ids.length, "포켓퀴즈 계정 포함:", ids.includes(cfg), JSON.stringify(a.errors||[]));
            if(ids.length===1&&ids[0]!==cfg) require("fs").appendFileSync(process.env.GITHUB_ENV,"CF_ACCOUNT="+ids[0]+"\n");
          ' "$cfg"
          if [ -n "$acct" ]; then
            if [ "$acct" = "$cfg" ]; then echo "토큰 계정 = 포켓퀴즈와 같은 계정"; else echo "::warning::토큰이 포켓퀴즈와 다른 Cloudflare 계정에서 만들어졌어요. 그 계정에 올립니다."; echo "CF_ACCOUNT=$acct" >> "$GITHUB_ENV"; fi
            code=$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/accounts/$acct/tokens/verify" || true)
            echo "토큰 확인 결과: HTTP $code $(node -e 'try{const j=require("./verify.json");console.log(j.success, j.result&&j.result.status, JSON.stringify(j.errors))}catch(e){}')"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 아직 없어서 인터넷에 올리지 않았어요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 이름 정하기 (미리보기면 -preview)
        id: names
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "worker=family-dashboard" >> "$GITHUB_OUTPUT"; echo "db=family-dashboard-db" >> "$GITHUB_OUTPUT"
          else
            echo "worker=family-dashboard-preview" >> "$GITHUB_OUTPUT"; echo "db=family-dashboard-preview-db" >> "$GITHUB_OUTPUT"
            sed -i 's/"name": "family-dashboard"/"name": "family-dashboard-preview"/; s/"database_name": "family-dashboard-db"/"database_name": "family-dashboard-preview-db"/' wrangler.jsonc
          fi
          if [ -n "$CF_ACCOUNT" ]; then sed -i "s/\"account_id\": *\"[0-9a-f]*\"/\"account_id\": \"$CF_ACCOUNT\"/" wrangler.jsonc; fi
          grep -n '"name"\|database_name' wrangler.jsonc

      - name: 기록 저장소 준비 (없으면 만들고 번호 채우기)
        if: steps.token.outputs.ready == 'true'
        run: |
          name="${{ steps.names.outputs.db }}"
          echo "열쇠로 Cloudflare 계정 확인:"
          npx wrangler whoami || true
          find_db() { npx wrangler d1 list --json > d1.json 2> d1.err || true; node -e 'const s=require("fs").readFileSync("d1.json","utf8");try{const l=JSON.parse(s);const d=l.find(x=>x.name===process.argv[1]);if(d)console.log(d.uuid)}catch(e){console.error("d1 list 결과를 읽지 못함:\n"+s.slice(0,1500))}' "$name"; }
          uuid=$(find_db)
          if [ -z "$uuid" ]; then npx wrangler d1 create "$name" || cat d1.err; uuid=$(find_db); fi
          [ -n "$uuid" ] || { echo "::error::기록 저장소 번호를 찾지 못했어요."; exit 1; }
          sed -i "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$uuid\"/" wrangler.jsonc

      - name: 기록 저장소 표 맞추기
        if: steps.token.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: 인터넷에 올리기
        if: steps.token.outputs.ready == 'true'
        run: |
          npx wrangler deploy | tee deploy.txt
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          echo "### 주소: $url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/state")
            echo "확인 $i: $code"
            [ "$code" = "401" ] && exit 0   # 접속 코드가 없으면 401 이 정상
            sleep 5
          done
          echo "::error::올린 화면이 대답하지 않아요."; exit 1
